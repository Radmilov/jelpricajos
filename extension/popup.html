<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="name" data-i18n="extName"></span>
    <span id="dot" class="dot"></span>
  </header>

  <section class="status">
    <div id="statusText" class="headline"></div>
    <div id="statusSub" class="sub mono"></div>
  </section>

  <section class="opts">
    <label class="row">
      <span data-i18n="optEnabled"></span>
      <input type="checkbox" id="enabled">
    </label>
    <label class="row">
      <span data-i18n="optBlur"></span>
      <input type="checkbox" id="blur">
    </label>
    <label class="row">
      <span><span data-i18n="optParty"></span><br><span class="hint" data-i18n="optPartyHint"></span></span>
      <input type="checkbox" id="muteParty">
    </label>
    <div class="row col">
      <span class="label" data-i18n="optScope"></span>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="scope" value="all"><span data-i18n="scopeAll"></span></label>
        <label><input type="radio" name="scope" value="parliament"><span data-i18n="scopeParliament"></span></label>
      </div>
    </div>
    <div class="row col">
      <label class="label" for="apiUrl" data-i18n="optApi"></label>
      <div class="inline">
        <input type="url" id="apiUrl" spellcheck="false" autocomplete="off">
        <button id="saveApi" type="button" data-i18n="save"></button>
      </div>
      <div id="apiMsg" class="hint"></div>
    </div>
  </section>

  <footer><a id="dash" href="#" data-i18n="openDashboard"></a></footer>
  <script src="popup.js"></script>
</body>
</html>
